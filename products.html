<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products</title>
</head>
<body>
    <h1>Connection test</h1>
    <ul id="list"></ul>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script>
        async function test() {
            const { data, error } = await db.from('products').select('*');
            if (error) {
                document.getElementById('list').innerText = 'Error: ' + error.message;
                return;
            }
            data.forEach(p => {
                document.getElementById('list').innerHTML += '<li>' + p.name + ' - Rs.' + p.price + ' - stock ' + p.stock_quantity + '</li>';
            });
        }
        test();
    </script>
</body>
</html>
