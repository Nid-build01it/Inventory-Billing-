{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ShelfSync{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'shop/style.css' %}">
</head>
<body>
<div class="d-flex">

    <div class="offcanvas-lg offcanvas-start sidebar" tabindex="-1" id="sidebar">
        <div class="offcanvas-header">
            <span class="logo">ShelfSync</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebar"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column p-3">
            <span class="logo d-none d-lg-block mb-4">ShelfSync</span>
            <a href="#">Dashboard</a>
            <a href="#">New Bill</a>
            <a href="/products/">Product's Info</a>
            <a href="#">Customer</a>
            <a href="#">Sale's History</a>
        </div>
    </div>

    <div class="flex-grow-1 content">
        <div class="topbar d-flex align-items-center p-3">
            <button class="btn btn-main d-lg-none me-3" data-bs-toggle="offcanvas" data-bs-target="#sidebar">☰</button>
            <h3 class="mb-0">{% block page_title %}{% endblock %}</h3>
        </div>
        <div class="p-3">
            {% block content %}{% endblock %}
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
